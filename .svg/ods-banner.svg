<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <defs>
    <style>
      .card {
        transition: transform 0.3s ease, filter 0.3s ease;
        transform-origin: center;
        transform-box: fill-box;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
      }
      .card:hover {
        transform: scale(1.04) translateY(-4px);
        filter: drop-shadow(0 10px 18px rgba(0,0,0,0.28));
      }
      .label {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;
        fill: #24292f;
        text-anchor: middle;
      }
      .sublabel {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 400;
        fill: #57606a;
        text-anchor: middle;
      }
      .badge {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #ffffff;
        text-anchor: middle;
      }
      .title {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #24292f;
        text-anchor: middle;
      }
      @media (prefers-color-scheme: dark) {
        .label   { fill: #e6edf3; }
        .sublabel{ fill: #8b949e; }
        .title   { fill: #e6edf3; }
      }
    </style>
  </defs>

  <!-- Fundo transparente (o GitHub aplica o tema) -->
  <rect width="720" height="360" fill="none"/>

  <!-- Título -->
  <text x="360" y="40" class="title">Objetivos de Desenvolvimento Sustentável</text>

  <!-- Card ODS 6 -->
  <g class="card">
    <rect x="40" y="70" width="300" height="260" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <image
      x="60" y="90" width="260" height="180"
      href="https://upload.wikimedia.org/wikipedia/commons/6/69/Objetivo_Desenvolvimento_Sustent%C3%A1vel_6_PT.webp"
      preserveAspectRatio="xMidYMid meet"/>
    <!-- Badge -->
    <rect x="150" y="282" width="80" height="20" rx="10" fill="#26bde2"/>
    <text x="190" y="296" class="badge">ODS 6</text>
    <!-- Legendas -->
    <text x="190" y="318" class="label">Água Potável e Saneamento</text>
  </g>

  <!-- Card ODS 13 -->
  <g class="card">
    <rect x="380" y="70" width="300" height="260" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <image
      x="400" y="90" width="260" height="180"
      href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Objetivo_Desenvolvimento_Sustent%C3%A1vel_13_PT.webp/960px-Objetivo_Desenvolvimento_Sustent%C3%A1vel_13_PT.webp"
      preserveAspectRatio="xMidYMid meet"/>
    <!-- Badge -->
    <rect x="490" y="282" width="80" height="20" rx="10" fill="#3f7e44"/>
    <text x="530" y="296" class="badge">ODS 13</text>
    <!-- Legendas -->
    <text x="530" y="318" class="label">Ação Contra a Mudança Global do Clima</text>
  </g>
</svg>